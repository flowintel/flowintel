# pyproject.toml - Flowintel
[project]
name = "flowintel"
version = "3.1.0"
description = "Open-source case management platform for security analysts"
requires-python = ">=3.12"
dependencies = [
]

[project.optional-dependencies]
# for later, not yet usable with the hybrid "fast uv pip init / deps in requirements.*"
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytest-randomly",
]

[tool.uv.sources]
# No custom sources for now

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning"
]
markers = [
    "concurrent_db: concurrent acces to db tests (example: race conditions) requires the legacy per-test database fixture",
    "legacy_db: requires the legacy per-test database fixture",
]