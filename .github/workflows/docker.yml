name: Build and Push Docker Image to GHCR

on:
  push:
    tags:
      - '*'  # Triggers on any tag push

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # owner/repo, lowercased below

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine if tag is on main
        id: branchcheck
        run: |
          git fetch origin main --quiet
          if [ "${{ github.sha }}" = "$(git rev-parse origin/main)" ]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }} # might be changed to ${{ github.actor }} ?
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Load build-time overrides from .env.build.maintained
        run: |
          if [ -s .env.build.maintained ]; then
            grep -vE '^\s*#|^\s*$' .env.build.maintained >> "$GITHUB_ENV"
          fi

      - name: Build and push Docker image via Bake
        uses: docker/bake-action@v6
        with:
          files: |
            ./docker-bake.hcl
          targets: flowintel
          push: true
          set: |
            # Maybe we prefer here so that ownership is clearer and avoid to create with "stolen" identity?
            # steps.image.outputs.name
            flowintel.tags=ghcr.io/${{ github.repository_owner }}/flowintel:${{ steps.branchcheck.outputs.is_main == 'true' && 'latest' || 'latest_test' }}
            flowintel.tags=ghcr.io/${{ github.repository_owner }}/flowintel:${{ github.ref_name }}
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
