    - name: New Test - Parallel
      run: |
        ./launch.sh -tnp

    - name: Upload debug logs (New Test - Parallel)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-new-parallel-${{ github.run_id }}
        path: newtests_gw*.log
        if-no-files-found: ignore

    - name: New Test - Sequential
      run: |
        ./launch.sh -tn

    - name: Upload debug logs (New Test - Sequential)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-new-sequential-${{ github.run_id }}
        path: newtests_master.log
        if-no-files-found: ignore

    - name: New Test - Sequential (Non Random)
      run: |
        ./launch.sh -tnnr

    - name: Upload debug logs (New Test - Sequential - Non Random)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-new-sequential-non-random-${{ github.run_id }}
        path: newtests_master.log
        if-no-files-found: ignore
####

####
    - name: Legacy Test - Parallel
      run: |
        ./launch.sh -tp

    - name: Upload debug logs (Legacy Test - Parallel)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-legacy-parallel-${{ github.run_id }}
        path: tests_gw*.log
        if-no-files-found: ignore

