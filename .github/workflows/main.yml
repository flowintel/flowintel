      run: |
        ./launch.sh -t

    - name: Upload debug logs (Legacy Test - Sequential)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-legacy-sequential-${{ github.run_id }}
        path: tests_master.log
        if-no-files-found: ignore

