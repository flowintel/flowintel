{# Partial: Connectors button + modal/collapse. Use data-connector-display attribute to force mode ("modal" or "collapse"). #}
<div id="connectors-button-wrapper" class="d-inline-flex align-items-center">
  <button id="btn-connectors-toggle" type="button" class="btn btn-connectors position-relative" style="background-color: #495057; border-color: #495057; color: #fff;" title="Connectors" aria-label="Connectors" @click="openConnectors($event)">
    <i class="fa-solid fa-plug"></i>
    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-dark" v-if="case_connectors_list && case_connectors_list.length">[[case_connectors_list.length]]</span>
  </button>
</div>

<!-- Connectors Modal -->
<div class="modal fade" id="connectorsModal" tabindex="-1" aria-labelledby="connectorsModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content morg-modal cconn-modal">
      <div class="modal-header">
        <span class="morg-modal-icon"><i class="fa-solid fa-plug"></i></span>
        <div>
          <h1 class="modal-title fs-5" id="connectorsModalLabel">Connectors</h1>
          <div class="morg-modal-sub">External instances (MISP, AIL…) linked to this case.</div>
        </div>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal" aria-label="Close" title="Close"></button>
      </div>
      <div class="modal-body">
        <div v-if="cases_info">
          <caseconnectors 
              :case_task_connectors_list="case_connectors_list"
              :all_connectors_list="all_connectors_list" :icons="connector_icons"
              :modules="modules"
              :is_case="true"
              :object_id="cases_info.case.id"
              :cases_info="cases_info"
              @case_connectors="(msg) => fetch_case_connectors()"
              @note_change="on_connector_note_change"
                >
          </caseconnectors>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Inline collapse (can be toggled instead of modal) -->
<div class="collapse" id="connectorsCollapseInline">
  <div class="card card-body connectors-inline p-0">
    <div v-if="cases_info">
      <caseconnectors 
          :case_task_connectors_list="case_connectors_list"
          :all_connectors_list="all_connectors_list" :icons="connector_icons"
          :modules="modules"
          :is_case="true"
          :object_id="cases_info.case.id"
          :cases_info="cases_info"
          @case_connectors="(msg) => fetch_case_connectors()"
          @note_change="on_connector_note_change"
              >
      </caseconnectors>
    </div>
  </div>
</div>

<!-- Controlled by Vue via `openConnectors` in the main component. -->
