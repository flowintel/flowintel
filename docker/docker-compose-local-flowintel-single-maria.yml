# This repository provides docker-compose files as a convenience for development and testing.
# For example, they support systematic testing of database schema changes across all supported database backends.
services:
  flowintel:
    # Generally, the locally built image is used in these examples. Less important to pin to sha256 as these artefact
    # should be completely controlled, pinning and scanning the build is still important depending on the governance
    # used on for production and registries. The pull_policy applied here would prevent to retrieve a missing local
    # image.
    image: flowintel:latest
    pull_policy: never
    container_name: flowintel
    command: bash -i ./launch.sh -ld
    ports:
      # If Flowintel needs to be reached from exterior (SimpleSaml IdP for example)
      # And not reverse proxy in Dev
      # - "0.0.0.0:${FLOWINTEL_APP_PORT:-7006}:${FLOWINTEL_APP_PORT:-7006}"
      # Hardening suggestion:
      - "127.0.0.1:${FLOWINTEL_APP_PORT:-7006}:${FLOWINTEL_APP_PORT:-7006}"
      - "[::1]:${FLOWINTEL_APP_PORT:-7006}:${FLOWINTEL_APP_PORT:-7006}"
    # Development hack 1:
    # Overwrites the environment defaults while avoiding that a missing .env file would make config
    # behavior somehow erratic
    # When using the Makefile, this is enforced with dotenv based on volume mounting below
    # Note: In production, it is might be chosen that this .env is rather loaded by a systemd .service
    # and is not findable by Docker, but this means the list of environment variables below must be made
    # consistent with the targeted config in production
    # For some reason, docker compose accept only the default ".env" -> tricky with the dotenv() of Python BTW !
    # env_file: "./.env"
    #
    environment:
      # If the .env is used to load secrets (only) in prod from file, all passwords can be suppressed in this block
      - SECRET_KEY=${SECRET_KEY:-SECRET_KEY_ENV_VAR_NOT_SET}
      #
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-flowintel}
      - DB_PASSWORD=${DB_PASSWORD:-your_secure_password_here}
      - DB_NAME=${DB_NAME:-flowintel}
      - DB_DIALECT=${DB_DIALECT:-mysql}
      - DB_DRIVER=${DB_DRIVER:-pymysql}
      #
      - VALKEY_IP=${VALKEY_IP:-valkey}
      - VALKEY_PASSWORD=${VALKEY_PASSWORD:-your_secure_valkey_password_here}
      #
      - ADMIN_FIRST_NAME=${ADMIN_FIRST_NAME:-admin}
      - ADMIN_LAST_NAME=${ADMIN_LAST_NAME:-admin}
      - ADMIN_MAIL=${ADMIN_MAIL:-admin@admin.admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - BOT_MAIL=${BOT_MAIL:-neo@admin.admin}
      #
      # By default, we use production config because the docker compose owns a database service
      - FLOWINTEL_APP_ENV=${FLOWINTEL_APP_ENV:-production}
      #
      - FLOWINTEL_APP_PORT=${FLOWINTEL_APP_PORT:-7006}
      - FLOWINTEL_APP_HOST=${FLOWINTEL_APP_HOST:-0.0.0.0}
    #
    networks:
      - net
    volumes:
      - flowintel-data:/var/lib/flowintel
      # Instead of including config at Docker build stage, we prefer to decouple and mount it as a volume
      - ../conf/config_module.py:/home/flowintel/app/conf/config_module.py:ro
      - ../conf/config.py:/home/flowintel/app/conf/config.py:ro
      # Development hack 2:
      # Creates the missing varenv above thanks to dotenv in python3:
      #   - dotenv does not override existing variables by default
      #   - in production, bypass dotenv by simply not mounting the file
      # - ./.env:/home/flowintel/app/.env
      #
    healthcheck:
      # TODO implement a /health endpoint in Flowintel ?
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:7006/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Docker hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  flowintel-data:

networks:
  net:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.0.0.0/24
        - subnet: fd31:50:0:1::/64
