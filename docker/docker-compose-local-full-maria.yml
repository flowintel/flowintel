# This repository provides docker-compose files as a convenience for development and testing.
# For example, they support systematic testing of database schema changes across all supported database backends.
services:
  mariadb:
    container_name: mariadb
    # In production, do not forget to pin to a scanned sha256 pinned image
    image: mariadb:12
    # Adapt to your needs
    # pull_policy: never
    # TODO
    # https://mariadb.com/docs/server/server-management/automated-mariadb-deployment-and-administration/docker-and-mariadb/mariadb-server-docker-official-image-environment-variables#using-_file-environment-variables-for-secrets
    #
    # Consider removing the expose ports if not necessary and the Flowintel stack runs in the same Docker Network
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:${DB_PORT:-3306}"
      - "[::1]:${DB_PORT:-3306}:${DB_PORT:-3306}"
    volumes:
      - db:/var/lib/mysql:rw
    environment:
      # If the .env is used to load secrets (only) in prod from file, this variables can be replaced
      # by a /run/secret file using classical Docker mechanism
      # This applies to all MYSQL_*_PASSWORD instances in this block
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-mysql}
      - MYSQL_USER=${DB_USER:-flowintel}
      - MYSQL_PASSWORD=${DB_PASSWORD:-your_secure_password_here}
      - MYSQL_DATABASE=${DB_NAME:-flowintel}
    networks:
# to delete if we define specific network
      - net
# to add if we define specific network
#      backend:
#        ipv4_address: 172.18.0.6
    restart: unless-stopped

  valkey:
    container_name: valkey
    # In production, do not forget to pin to a scanned sha256 pinned image
    image: valkey/valkey
    # Adapt to your needs
    # pull_policy: never
    # Consider removing the expose ports if not necessary and the Flowintel stack runs in the same Docker Network
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:${VALKEY_PORT:-6379}"
      - "[::1]:${VALKEY_PORT:-6379}:${VALKEY_PORT:-6379}"
    environment:
      # If the .env is used to load secrets (only) in prod from file, this variables can be replaced
      # by a /run/secrets file using classical Docker mechanism
      # This applies to all VALKEY_PASSWORD instances in this block
      - VALKEY_PASSWORD=${VALKEY_PASSWORD:-your_secure_valkey_password_here}
    networks:
# to delete if specific network is needed
      - net
# to add if specific network is needed
#     backend:
#      ipv4_address: 172.18.0.5
    user: "999:999"
    # Do not forget to mount the secrets if using the /run/secrets file mechanism
    # secrets:
    #   - valkey_password
    #
    volumes:
      - valkey-data:/data:rw
    # Choose according to needs in Production - See above
    # command:
    #   - sh
    #   - -c
    #   - 'exec valkey-server --requirepass "$$(cat /run/secrets/valkey_password)"'
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD}"]
    healthcheck:
      # Choose according to needs in Production - See above
      # test:
      #   - CMD-SHELL
      #   - 'valkey-cli -a "$$(cat /run/secrets/valkey_password)" --no-auth-warning ping | grep -qx PONG';
      test:
        - CMD-SHELL
        - >-
          valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep -qx PONG;
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    # Docker hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  flowintel:
    container_name: flowintel
    # Generally, the locally built image is used in these examples. Less important to pin to sha256 as these artefact
    # should be completely controlled, pinning and scanning the build is still important depending on the governance
    # used on for production and registries. The pull_policy applied here would prevent to retrieve a missing local
    # image. Adapt accordingly to your needs.
    image: flowintel:latest
    pull_policy: never
    ports:
      # If Flowintel needs to be reached from exterior (SimpleSaml IdP for example)
      # And not reverse proxy in Dev
      # - "0.0.0.0:${FLOWINTEL_APP_PORT:-7006}:${FLOWINTEL_APP_PORT:-7006}"
      # Hardening suggestion:
      - "127.0.0.1:${FLOWINTEL_APP_PORT:-7006}:${FLOWINTEL_APP_PORT:-7006}"
      - "[::1]:${FLOWINTEL_APP_PORT:-7006}:${FLOWINTEL_APP_PORT:-7006}"
    # Development hack 1:
    # Overwrites the environment defaults while avoiding that a missing .env file would make config
    # behavior somehow erratic
    # When using the Makefile, this is enforced with dotenv based on volume mounting below
    # Note: In production, it is might be chosen that this .env is rather loaded by a systemd .service
    # and is not findable by Docker, but this means the list of environment variables below must be made
    # consistent with the targeted config in production
    # For some reason, docker compose accept only the default ".env" -> tricky with the dotenv() of Python BTW !
    # Cannot be combined with secrets section loading the .env !
    # env_file: "./.env"
    #
    environment:
      # If the .env is used to load secrets (only) in prod from file, all passwords can be suppressed in this block.
      # See secrets section below.
      - SECRET_KEY=${SECRET_KEY:-SECRET_KEY_ENV_VAR_NOT_SET}
      #
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-flowintel}
      - DB_PASSWORD=${DB_PASSWORD:-your_secure_password_here}
      - DB_NAME=${DB_NAME:-flowintel}
      - DB_DIALECT=${DB_DIALECT:-mysql}
      - DB_DRIVER=${DB_DRIVER:-pymysql}
      #
      - VALKEY_IP=${VALKEY_IP:-valkey}
      - VALKEY_PASSWORD=${VALKEY_PASSWORD:-your_secure_valkey_password_here}
      #
      - ADMIN_FIRST_NAME=${ADMIN_FIRST_NAME:-admin}
      - ADMIN_LAST_NAME=${ADMIN_LAST_NAME:-admin}
      - ADMIN_MAIL=${ADMIN_MAIL:-admin@admin.admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - BOT_MAIL=${BOT_MAIL:-neo@admin.admin}
      #
      # By default, we use production config because the docker compose owns a database service
      # This one does not appear in config.py, but is read by App factory
      - FLOWINTEL_APP_ENV=${FLOWINTEL_APP_ENV:-production}
      #
      - FLOWINTEL_APP_PORT=${FLOWINTEL_APP_PORT:-7006}
      - FLOWINTEL_APP_HOST=${FLOWINTEL_APP_HOST:-0.0.0.0}
    #
    networks:
# to delete if we define specific network
      - net
# to add if we define specific network
#      backend:
#        ipv4_address: 172.18.0.4
    # If using the .env to mount secrets.
    # secrets:
    #   - source: flowintel_dot_env
    #     target: /home/flowintel/app/.env
    volumes:
      # data
      - flowintel-data:/var/lib/flowintel:rw
      - flowintel-data-uploads:/home/flowintel/app/uploads:rw
      # Instead of including config at Docker build stage, we prefer to decouple and mount it as a volume
      - ../conf/config_module.py:/home/flowintel/app/conf/config_module.py:ro
      - ../conf/config.py:/home/flowintel/app/conf/config.py:ro
      # Development hack 2:
      # Creates the missing varenv above thanks to dotenv in python3:
      #   - dotenv does not override existing variables by default
      #   - in production, bypass dotenv by simply not mounting the file
      # Cannot be combined with secrets section loading the .env !
      # - ./.env:/home/flowintel/app/.env
      #
      # Logs
      - flowintel-logs:/home/flowintel/app/logs:rw
      # History
      - flowintel-history:/home/flowintel/app/history:rw
    depends_on:
      mariadb:
        condition: service_started      # or service_healthy if mariadb has a healthcheck
      valkey:
        condition: service_healthy
        restart: true
    command: bash -i ./launch.sh -ld
    healthcheck:
      # TODO implement a /health endpoint in Flowintel ?
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:7006/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Docker hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Further hardening for production
    # read_only: true      # needs also writable volumes for uploads/, logs/ and history/, plus tmpfs for /tmp as optional in Production
    restart: unless-stopped

volumes:
  db:
  flowintel-logs:
  flowintel-data:
  flowintel-data-uploads:
  flowintel-history:
  valkey-data:

networks:
  net:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.0.0.0/24
        - subnet: fd31:50:0:1::/64

# Choose according to needs in Production - See above
# secrets:
#   valkey_password:
#     file: /etc/flowintel/secrets/valkey_password
#   flowintel_dot_env:
#    file: /etc/flowintel/.env
